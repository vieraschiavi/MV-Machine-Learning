<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="MV AutoML Studio — ETL automático, AutoML y análisis estadístico sobre cualquier dataset.">
<meta name="color-scheme" content="light dark">
<title>MV AutoML Studio</title>
<link rel="stylesheet" href="/assets/css/app.css">

<div class="app">

        <div>

          <div class="brand-sub" data-i18n="app.tagline"></div>

      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <span id="version">v1.0.0</span>

      <select id="lang-select" style="width:auto;min-width:118px" aria-label="Language"></select>
      <button class="btn btn-ghost btn-icon" id="audio-btn" type="button"></button>
      <button class="btn btn-ghost btn-icon" id="audio-settings-btn" type="button" data-i18n-title="audio.title">

      <button class="btn btn-ghost btn-icon" id="theme-btn" type="button"></button>
    </header>

    <main class="content">
      <section class="view" id="view-overview"></section>
      <section class="view" id="view-data"></section>
      <section class="view" id="view-explore"></section>
      <section class="view" id="view-etl"></section>
      <section class="view" id="view-model"></section>
      <section class="view" id="view-results"></section>
      <section class="view" id="view-ai"></section>
      <section class="view" id="view-export"></section>
    </main>
  </div>
</div>

<script type="module" src="/assets/js/app.js"></script>

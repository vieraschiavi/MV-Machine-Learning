[project]
name = "mv-automl-studio"
version = "1.0.0"
description = "ETL automático, AutoML y análisis estadístico sobre cualquier dataset"
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore::FutureWarning",
]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["data", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",   # el largo de línea lo controla el formateo, no el linter
    "B008",   # Depends() de FastAPI se declara en la firma
    "C401",
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["E402"]   # las pruebas fijan variables de entorno antes de importar

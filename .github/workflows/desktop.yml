name: Escritorio Windows

# Compila el instalador .exe en un runner Windows REAL, prueba el binario
# congelado de punta a punta (token, subida, entrenamiento) y publica:
#   · el instalador Demo en un release público;
#   · el instalador Owner en un release BORRADOR: sólo lo ven los
#     colaboradores del repositorio, que es exactamente el pedido
#     ("un exe versión owner en GitHub sólo para probar el programa full").
on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Instalador Windows (demo + owner)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dependencias del backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Suite de pruebas (gate antes de empaquetar)
        run: python -m pytest backend/tests -q

      - name: Compilar el backend (PyInstaller)
        working-directory: desktop
        run: python -m PyInstaller --distpath ../pybuild -y mv-backend.spec

      # ── credenciales de licencia ────────────────────────────────────────────
      # Con secrets configurados se usan las claves estables de producción.
      # Sin secrets, se genera un par efímero y se avisa: las licencias que se
      # vendan sólo validan contra builds hechos con la MISMA clave pública.
      #
      # Los dos archivos van a `desktop/owner/`, que es la ÚNICA carpeta que
      # `electron-builder.yml` empaqueta (`extraResources`) y de la que
      # `main.cjs` los lee (`resources/owner/`). La clave pública estuvo yendo a
      # `desktop/keys/`, que no se empaqueta: no viajaba en ningún instalador,
      # así que `licensing.py` caía a su marcador —33 bytes, cuando Ed25519 pide
      # 32— y rechazaba TODAS las licencias. El owner arrancaba en demo con su
      # licencia adentro, y al cliente que pagaba le rebotaba la suya.
      #
      # `public.key` viaja en los dos canales (es pública, y sin ella el cliente
      # no puede activar lo que compró); `license.key`, sólo en el owner.
      - name: Claves y licencia owner
        shell: bash
        env:
          PRIV: ${{ secrets.MV_LICENSE_PRIVATE_KEY }}
          PUB: ${{ secrets.MV_LICENSE_PUBLIC_KEY }}
        run: |
          mkdir -p desktop/owner
          python - <<'PY'
          import os, sys
          sys.path.insert(0, "backend")
          from app.core import licensing as L

          priv = os.environ.get("PRIV") or ""
          pub = os.environ.get("PUB") or ""
          if not priv or not pub:
              priv, pub = L.generate_keypair()
              print("::warning::Sin secrets MV_LICENSE_*: par de claves efímero. "
                    "Configurá los secrets para que las licencias vendidas "
                    "validen contra futuros builds.")
          open("desktop/owner/public.key", "w").write(pub)
          token = L.issue("owner", "Owner build (CI)", days=None, private_key_b64=priv)
          open("desktop/owner/license.key", "w").write(token)
          # se valida acá mismo: un owner.exe con licencia rota no debe publicarse
          L.PUBLIC_KEY_B64 = pub
          assert L.verify(token).tier == "owner"
          print("licencia owner emitida y verificada")
          PY

      # ── smoke del binario CONGELADO en Windows ──────────────────────────────
      - name: Probar el .exe del backend (auth + subida + entrenamiento)
        shell: bash
        run: |
          export MV_DATA_DIR="$RUNNER_TEMP/mvdata"
          export MV_PORT=8475
          export MV_API_TOKEN=tok-ci
          # La misma que le pasa `main.cjs` apuntando a `resources/frontend`.
          # Durante mucho tiempo esta línea estuvo acá y NO en el programa: la
          # prueba le daba al backend una configuración que el producto no
          # tenía, así que pasaba en verde mientras el instalador abría una
          # ventana con {"detail": "Not Found"}. Que exista acá sólo vale si
          # `main.cjs` la pasa también, y eso lo vigila
          # `test_el_programa_le_dice_al_backend_donde_quedo_la_interfaz`.
          export MV_FRONTEND_DIR="$PWD/frontend"
          # La salida del binario se guarda: si no levanta, lo único que
          # explica por qué es su propio error, y en background se perdía.
          ./pybuild/mv-backend/mv-backend.exe > "$RUNNER_TEMP/backend.log" 2>&1 &
          BACK=$!
          for i in $(seq 1 90); do
            if curl -fsS -m 3 "http://127.0.0.1:8475/api/health" > /dev/null 2>&1; then
              echo "el backend respondió a los $((i * 2)) segundos"; break
            fi
            if ! kill -0 "$BACK" 2>/dev/null; then
              echo "::error::el .exe terminó solo, sin llegar a escuchar. Su salida:"
              cat "$RUNNER_TEMP/backend.log" || true
              exit 1
            fi
            if [ "$i" = "90" ]; then
              echo "::error::el .exe no respondió en 180 s; su salida fue:"
              cat "$RUNNER_TEMP/backend.log" || true
              exit 1
            fi
            sleep 2
          done
          python - <<'PY'
          import httpx, time
          B = "http://127.0.0.1:8475"; H = {"X-MV-Token": "tok-ci"}
          C = httpx.Client(timeout=60)
          assert C.get(f"{B}/api/datasets").status_code == 401, "la auth no corta"
          assert C.get(f"{B}/api/datasets", headers=H).status_code == 200
          # La interfaz, que es lo único que el usuario ve al abrir el programa.
          # Esta prueba pedía sólo endpoints de /api, así que un backend que no
          # montaba la interfaz la pasaba entera y el instalador abría una
          # ventana con {"detail": "Not Found"}.
          raiz = C.get(f"{B}/")
          assert raiz.status_code == 200, (
              f"la raíz devolvió {raiz.status_code}: {raiz.text[:200]}")
          # El index.html es HTML5 sin etiqueta <html>: se busca su título,
          # que además confirma que es LA página del producto y no otra cosa.
          assert "<title>MV AutoML Studio</title>" in raiz.text, (
              f"la raíz no devuelve la interfaz sino: {raiz.text[:200]}")
          assert C.get(f"{B}/assets/js/app.js").status_code == 200, "no sirve /assets"
          print("la interfaz se sirve desde el .exe")
          data = open("examples/gestiones_con_texto.csv", "rb").read()
          r = C.post(f"{B}/api/datasets/upload-stream",
                     params={"filename": "g.csv", "name": "ci"},
                     content=data, headers=H).json()
          job = C.post(f"{B}/api/automl/train", headers=H, json={
              "dataset_id": r["dataset"]["id"], "target": "Pago30d",
              "budget_seconds": 20, "max_models": 3, "shap": True,
              "permutation_importance": True, "exclude": ["IdGestion"]}).json()
          for _ in range(120):
              st = C.get(f"{B}/api/jobs/{job['id']}", headers=H).json()
              if st["status"] in ("terminado", "error"): break
              time.sleep(2)
          assert st["status"] == "terminado", st.get("error")
          auc = st["result"]["report"]["champion"]["holdout"]["auc"]
          print(f"ENTRENAMIENTO EN EL .EXE: AUC holdout = {auc:.4f}")
          # el ejemplo tiene señal realista, no fuga: un AUC perfecto sería
          # la señal de que algo se rompió, no de que anda bien
          assert 0.78 < auc < 0.99, f"AUC fuera de lo esperable: {auc}"
          # SHAP se ejercita a propósito: importa numba al arrancar, y cuando
          # numba faltaba el binario moría antes de escuchar. Si la prueba no
          # lo usara, el que se encontraría con el error sería el cliente.
          variables = st["result"]["report"]["features"]["ranking"]
          assert any(v.get("shap_mean_abs") for v in variables), "SHAP no calculó nada"
          print(f"SHAP en el .exe: {len(variables)} variables explicadas")
          PY
          kill $BACK || true

      # ── instaladores ────────────────────────────────────────────────────────
      # Dos cosas que costaron un build cada una:
      #   · van en bash y no en PowerShell, porque PowerShell parte
      #     `-c.win.artifactName="..."` en dos argumentos y electron-builder
      #     toma el segundo pedazo como nombre de archivo de configuración;
      #   · el nombre se pisa en `win.artifactName`, no en el `artifactName` de
      #     primer nivel: la clave específica de la plataforma gana, y el
      #     genérico se ignora sin decir nada.
      # Igual el .exe se mueve por comodín: el nombre real lo arma una plantilla
      # con macros, y si alguno cambiara de valor el paso siguiente no tiene por
      # qué morir buscando un nombre exacto.
      - name: Instalador OWNER (con licencia embebida)
        working-directory: desktop
        shell: bash
        run: |
          npm install
          npx electron-builder --win -p never -c electron-builder.yml \
            -c.extraMetadata.channel=owner \
            -c.win.artifactName="MV-AutoML-Studio-Owner-Setup.exe"
          # Se aparta antes de compilar el demo: los dos empaquetados escriben
          # en dist/ y el segundo puede llevarse puesto lo del primero.
          mkdir -p ../entrega
          mv dist/*Setup.exe ../entrega/MV-AutoML-Studio-Owner-Setup.exe

      # ── el instalador se INSTALA, no se mira ────────────────────────────────
      # Todo lo que probaba el instalador hasta acá leía archivos de texto: que
      # el .nsh existiera, que electron-builder lo referenciara, que el mensaje
      # no tuviera acentos. Nada ejecutaba el .exe. Así se publicó un instalador
      # que al doble clic no hacía absolutamente nada —un `Abort` en `.onInit`
      # cierra NSIS sin mostrar una palabra, ni ventana ni error— y el build
      # salió verde igual. Mismo patrón que el bug de MV_FRONTEND_DIR: la prueba
      # medía el texto, no el producto.
      #
      # Esto lo instala de verdad EN UNA CARPETA ELEGIDA —que es además lo que
      # se pidió poder hacer— y comprueba que lo que quedó instalado arranca.
      - name: Instalar el .exe owner y comprobar que el programa quedó usable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = "$env:GITHUB_WORKSPACE\entrega\MV-AutoML-Studio-Owner-Setup.exe"
          # Sin espacios a propósito: NSIS no admite comillas en /D= y toma el
          # resto de la línea como ruta.
          $destino = "$env:RUNNER_TEMP\mv-instalado"

          if (-not (Test-Path $setup)) { throw "no existe el instalador: $setup" }
          "instalador: {0:N0} MB" -f ((Get-Item $setup).Length / 1MB)

          # /S silenciosa, /D= destino. /D va último y sin comillas: es la
          # sintaxis de NSIS, no la de PowerShell.
          cmd /c "`"$setup`" /S /D=$destino"
          "el instalador devolvio: $LASTEXITCODE"

          # NSIS en modo /S puede devolver antes de terminar de copiar.
          $exe = "$destino\MV AutoML Studio.exe"
          for ($i = 0; $i -lt 150; $i++) {
            if (Test-Path $exe) { break }
            Start-Sleep -Seconds 2
          }
          if (-not (Test-Path $exe)) {
            Write-Host "::error::el instalador corrió y NO dejó el programa en $destino"
            if (Test-Path $destino) { Get-ChildItem -Recurse $destino | Select -First 40 }
            else { "la carpeta de destino ni siquiera se creó" }
            exit 1
          }
          "instalado en la carpeta elegida: $destino"

          # Lo que hace utilizable a la instalación, pieza por pieza. Cada una
          # de éstas faltó alguna vez y el síntoma fue distinto: sin frontend,
          # una ventana con {"detail":"Not Found"}; sin public.key, todas las
          # licencias rechazadas; sin license.key, el owner arrancando en demo.
          $piezas = @{
            "el backend"           = "$destino\resources\mv-backend\mv-backend.exe"
            "la interfaz"          = "$destino\resources\frontend\index.html"
            "la clave publica"     = "$destino\resources\owner\public.key"
            "la licencia owner"    = "$destino\resources\owner\license.key"
          }
          $faltan = @()
          foreach ($p in $piezas.GetEnumerator()) {
            if (Test-Path $p.Value) { "  OK  $($p.Key)" }
            else { $faltan += $p.Key; Write-Host "::error::falta $($p.Key): $($p.Value)" }
          }
          if ($faltan.Count) { exit 1 }

          # Y que lo instalado ARRANQUE. Que los archivos estén no alcanza: el
          # cliente no abre archivos, abre el programa.
          $env:MV_DATA_DIR = "$env:RUNNER_TEMP\mvdata-instalado"
          $env:MV_PORT = "8477"
          $env:MV_API_TOKEN = "tok-instalado"
          $env:MV_FRONTEND_DIR = "$destino\resources\frontend"
          $log = "$env:RUNNER_TEMP\backend-instalado.log"
          $back = Start-Process -FilePath "$destino\resources\mv-backend\mv-backend.exe" `
                    -RedirectStandardOutput $log -RedirectStandardError "$log.err" -PassThru
          $vivo = $false
          for ($i = 0; $i -lt 90; $i++) {
            try {
              if ((Invoke-WebRequest -Uri "http://127.0.0.1:8477/api/health" `
                    -TimeoutSec 3 -UseBasicParsing).StatusCode -eq 200) {
                $vivo = $true; "el backend instalado respondio a los $($i * 2) s"; break
              }
            } catch { }
            if ($back.HasExited) { break }
            Start-Sleep -Seconds 2
          }
          if (-not $vivo) {
            Write-Host "::error::el programa instalado no llego a responder. Su salida:"
            Get-Content $log, "$log.err" -ErrorAction SilentlyContinue
            exit 1
          }
          $raiz = Invoke-WebRequest -Uri "http://127.0.0.1:8477/" -TimeoutSec 10 -UseBasicParsing
          if ($raiz.Content -notmatch "<title>MV AutoML Studio</title>") {
            Write-Host "::error::la instalacion no sirve la interfaz sino: $($raiz.Content.Substring(0, 200))"
            exit 1
          }
          "la instalacion sirve la interfaz del producto"
          Stop-Process -Id $back.Id -Force -ErrorAction SilentlyContinue

          # Se libera el disco: el empaquetado del cliente vuelve a escribir en
          # dist/ y el runner no tiene lugar de sobra.
          Remove-Item -Recurse -Force $destino -ErrorAction SilentlyContinue

      # ── copia portable, sin instalador ──────────────────────────────────────
      # El instalador NSIS extrae su paquete interno a `%TEMP%` y recién
      # después lo descomprime al destino: necesita el espacio dos veces, y el
      # `%TEMP%` está en el disco del sistema aunque instales en otro. Cuando
      # ahí no entra, la instalación muere con «error escribiendo al archivo
      # ...\app-64.7z», que no dice nada de espacio.
      #
      # Esta copia no pasa por NSIS: se descomprime donde sea y se ejecuta. Con
      # la carpeta `datos` adentro, además, el programa guarda todo al lado
      # suyo (ver `carpeta-datos.cjs`), así que una copia en D: no toca C: en
      # ningún momento.
      #
      # La carpeta va acá y no en `extraFiles` a propósito: `extraFiles` la
      # metería también en el instalador, y ahí es dañina —el desinstalador
      # borra el directorio del programa, y se llevaría los datasets del
      # cliente—. Portable la trae; instalado, no.
      - name: Copia portable OWNER (sin instalador, sin %TEMP%)
        working-directory: desktop
        shell: bash
        run: |
          # El .zip no instala, así que nadie le crea el icono: el creador de
          # accesos directos viaja adentro y lo resuelve sin convertirlo en
          # una instalación. En el instalador NSIS no hace falta —ya los deja
          # solo—, y por eso no se agrega a `extraFiles`.
          cp ../instalador-owner/Crear-accesos-directos.bat dist/win-unpacked/
          mkdir -p dist/win-unpacked/datos
          cat > dist/win-unpacked/datos/LEEME.txt <<'TXT'
          Los datasets, los modelos y los informes se guardan en esta carpeta.

          Existe a proposito: mientras este aca, el programa guarda todo al
          lado suyo y no escribe nada en el disco del sistema. Si la borras,
          vuelve a usar el perfil del usuario (en Windows, dentro de C:).

          Para mover todo a otro lado, copia la carpeta entera del programa
          donde quieras: los datos viajan con ella.
          TXT
          command -v 7z > /dev/null || { echo "::error::falta 7z en el runner"; exit 1; }
          # Absoluta: el `cd` de la línea siguiente cambia el punto de partida.
          ZIP="$PWD/../entrega/MV-AutoML-Studio-Owner-Portable.zip"
          cd dist/win-unpacked
          7z a -tzip -mx=5 "$ZIP" . > /dev/null
          # Que el .zip exista no alcanza: lo que lo hace utilizable es traer el
          # ejecutable y la carpeta `datos`. Si faltara alguno, se publica una
          # copia que arranca mal o escribe en C:, y eso se descubre usándola.
          7z l "$ZIP" > /tmp/contenido.txt
          grep -q "MV AutoML Studio.exe" /tmp/contenido.txt \
            || { echo "::error::el .zip portable no trae el ejecutable"; exit 1; }
          grep -q "datos" /tmp/contenido.txt \
            || { echo "::error::el .zip portable no trae la carpeta datos"; exit 1; }
          grep -q "Crear-accesos-directos.bat" /tmp/contenido.txt \
            || { echo "::error::el .zip portable no trae el creador de accesos"; exit 1; }
          echo "portable: $(du -h "$ZIP" | cut -f1), con ejecutable, datos y accesos"

      # El activador, con la licencia de ESTE build ya adentro.
      #
      # El instalador owner arranca solo en nivel Owner —lleva la licencia y la
      # clave que la valida—, así que esto es para el otro caso: convertir una
      # instalación de cliente que ya esté hecha, sin bajar el instalador de
      # nuevo. Se genera acá y no se versiona porque la licencia sólo vale
      # contra la clave pública de este build: un archivo fijo en el repositorio
      # quedaría viejo en cuanto cambien las claves, y encima pidiendo pegarla a
      # mano es justo lo que no queremos.
      - name: Activador OWNER (sin preguntas)
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          token = Path("desktop/owner/license.key").read_text(encoding="utf-8").strip()
          plantilla = Path("instalador-owner/Activar-OWNER.bat").read_text(encoding="utf-8")
          # Se rellena el hueco que el script deja para la licencia: con esto
          # deja de preguntar y escribe el sello directo.
          salida = plantilla.replace('set "LIC_EMBEBIDA="',
                                     f'set "LIC_EMBEBIDA={token}"', 1)
          assert token in salida, "no se pudo embeber la licencia en el activador"
          Path("entrega/Activar-OWNER.bat").write_bytes(
              salida.replace("\r\n", "\n").replace("\n", "\r\n").encode("ascii"))
          print("activador owner listo, con licencia adentro")
          PY

      - name: Instalador CLIENTE (sin licencia; misma clave pública)
        working-directory: desktop
        shell: bash
        run: |
          rm -f owner/license.key         # el del cliente NO lleva la licencia
          echo 'Compilacion de cliente: sin licencia embebida.' > owner/LEEME.txt
          npx electron-builder --win -p never -c electron-builder.yml \
            -c.extraMetadata.channel=cliente \
            -c.win.artifactName="MV-AutoML-Studio-Setup.exe"
          mv dist/*Setup.exe ../entrega/MV-AutoML-Studio-Setup.exe

      # Cierre de lo que dejaron las compilaciones viejas.
      #
      # `softprops/action-gh-release` con `draft: true` **no** convierte de
      # vuelta a borrador un release que ya estaba publicado: lo actualiza y lo
      # deja público. Como `desktop-latest` venía publicado de antes, el primer
      # intento de cerrar la descarga no cerró nada — subió el instalador nuevo
      # al mismo release abierto, con un texto que decía «esto es un borrador».
      # Peor que no haber hecho nada, porque parecía hecho.
      - name: Cerrar el release público que quedó de antes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
                 --jq '.[] | select(.tag_name=="desktop-latest" and .draft==false) | .id' || true)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=true
            echo "::warning::desktop-latest estaba público con el instalador adentro; se pasó a borrador."
          else
            echo "no hay ningún release público en desktop-latest"
          fi

      # El instalador NO se publica abierto. Un archivo público es el artefacto
      # de ingeniería regalado a cualquiera que pase, competencia incluida, y
      # sin dejar rastro de quién se lo llevó. El release queda en borrador —sus
      # archivos no son alcanzables sin credenciales— y la única puerta es
      # `/api/descargar`, que verifica la licencia del cliente antes de darle un
      # enlace temporal. Quien quiere conocerlo sin comprar pide una demo en
      # vivo desde el sitio.
      #
      # La etiqueta cambia en cada compilación, igual que la del owner. Reusar
      # una etiqueta fija fue lo que abrió el agujero de arriba: un release que
      # ya existe publicado no vuelve solo a borrador. Con una etiqueta nueva,
      # cada release nace borrador y no hay nada que revertir. `/api/descargar`
      # recorre los releases y toma el más nuevo que tenga el instalador, así
      # que el nombre de la etiqueta le da igual.
      - name: Publicar el instalador del CLIENTE (borrador; lo entrega /api/descargar)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('cliente-{0}', github.run_number) }}
          name: MV AutoML Studio — instalador Windows (${{ github.run_number }})
          draft: true
          files: entrega/MV-AutoML-Studio-Setup.exe
          body: |
            Instalador de Windows (64 bits). Arranca en período de prueba y se
            activa a Profesional con una licencia. Permite elegir el directorio
            de instalación y crea los accesos directos en el Escritorio y el
            Menú de inicio.

            Este release es un borrador a propósito: el archivo se entrega por
            `/api/descargar`, que primero verifica la licencia del comprador.

      # Publicado, no borrador, y a propósito.
      #
      # El borrador existía para que el instalador no quedara a la vista cuando
      # el repositorio era público. Ahora el repositorio es privado, así que lo
      # que protege el archivo es el repositorio mismo: un release publicado acá
      # lo ven los colaboradores y nadie más, igual que el borrador.
      #
      # Lo que sí cambia es poder llegar: un borrador no tiene URL estable —la
      # que devuelve la API es `untagged-<hash>` y da 404 en el navegador—, así
      # que había que entrar a Releases y buscarlo a ojo. Publicado, el link es
      # siempre `/releases/tag/owner-<número>`.
      # Las huellas van en el cuerpo del release, no en un archivo aparte:
      # sirven para descartar en diez segundos la causa más común de que un
      # archivo de cientos de MB falle al instalar —que la descarga se haya
      # cortado—, y sólo sirven si están a la vista de quien baja.
      - name: Texto del release, con las huellas de cada archivo
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          def huella(p: Path) -> str:
              h = hashlib.sha256()
              with p.open("rb") as f:
                  for bloque in iter(lambda: f.read(1 << 20), b""):
                      h.update(bloque)
              return h.hexdigest()

          archivos = ["MV-AutoML-Studio-Owner-Setup.exe",
                      "MV-AutoML-Studio-Owner-Portable.zip",
                      "Activar-OWNER.bat"]
          def tamano(n: int) -> str:
              # el activador pesa 3 KB y en MB se veía «0 MB»
              return f"{n / (1 << 20):,.0f} MB" if n >= (1 << 20) else f"{n / 1024:,.0f} KB"

          filas = []
          for nombre in archivos:
              p = Path("entrega") / nombre
              filas.append(f"| `{nombre}` | {tamano(p.stat().st_size)} | `{huella(p)}` |")


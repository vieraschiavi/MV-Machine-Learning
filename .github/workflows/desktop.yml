name: Escritorio Windows

# Compila el instalador .exe en un runner Windows REAL, prueba el binario
# congelado de punta a punta (token, subida, entrenamiento) y publica:
#   · el instalador Demo en un release público;
#   · el instalador Owner en un release BORRADOR: sólo lo ven los
#     colaboradores del repositorio, que es exactamente el pedido
#     ("un exe versión owner en GitHub sólo para probar el programa full").
on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Instalador Windows (demo + owner)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dependencias del backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Suite de pruebas (gate antes de empaquetar)
        run: python -m pytest backend/tests -q

      - name: Compilar el backend (PyInstaller)
        working-directory: desktop
        run: python -m PyInstaller --distpath ../pybuild -y mv-backend.spec

      # ── credenciales de licencia ────────────────────────────────────────────
      # Con secrets configurados se usan las claves estables de producción.
      # Sin secrets, se genera un par efímero y se avisa: las licencias que se
      # vendan sólo validan contra builds hechos con la MISMA clave pública.
      - name: Claves y licencia owner
        shell: bash
        env:
          PRIV: ${{ secrets.MV_LICENSE_PRIVATE_KEY }}
          PUB: ${{ secrets.MV_LICENSE_PUBLIC_KEY }}
        run: |
          mkdir -p desktop/keys desktop/owner
          python - <<'PY'
          import os, sys
          sys.path.insert(0, "backend")
          from app.core import licensing as L

          priv = os.environ.get("PRIV") or ""
          pub = os.environ.get("PUB") or ""
          if not priv or not pub:
              priv, pub = L.generate_keypair()
              print("::warning::Sin secrets MV_LICENSE_*: par de claves efímero. "
                    "Configurá los secrets para que las licencias vendidas "
                    "validen contra futuros builds.")
          open("desktop/keys/public.key", "w").write(pub)
          token = L.issue("owner", "Owner build (CI)", days=None, private_key_b64=priv)
          open("desktop/owner/license.key", "w").write(token)
          # se valida acá mismo: un owner.exe con licencia rota no debe publicarse
          L.PUBLIC_KEY_B64 = pub
          assert L.verify(token).tier == "owner"
          print("licencia owner emitida y verificada")
          PY

      # ── smoke del binario CONGELADO en Windows ──────────────────────────────
      - name: Probar el .exe del backend (auth + subida + entrenamiento)
        shell: bash
        run: |
          export MV_DATA_DIR="$RUNNER_TEMP/mvdata"
          export MV_PORT=8475
          export MV_API_TOKEN=tok-ci
          export MV_FRONTEND_DIR="$PWD/frontend"
          # La salida del binario se guarda: si no levanta, lo único que
          # explica por qué es su propio error, y en background se perdía.
          ./pybuild/mv-backend/mv-backend.exe > "$RUNNER_TEMP/backend.log" 2>&1 &
          BACK=$!
          for i in $(seq 1 90); do
            if curl -fsS -m 3 "http://127.0.0.1:8475/api/health" > /dev/null 2>&1; then
              echo "el backend respondió a los $((i * 2)) segundos"; break
            fi
            if ! kill -0 "$BACK" 2>/dev/null; then
              echo "::error::el .exe terminó solo, sin llegar a escuchar. Su salida:"
              cat "$RUNNER_TEMP/backend.log" || true
              exit 1
            fi
            if [ "$i" = "90" ]; then
              echo "::error::el .exe no respondió en 180 s; su salida fue:"
              cat "$RUNNER_TEMP/backend.log" || true
              exit 1
            fi
            sleep 2
          done
          python - <<'PY'
          import httpx, time
          B = "http://127.0.0.1:8475"; H = {"X-MV-Token": "tok-ci"}
          C = httpx.Client(timeout=60)
          assert C.get(f"{B}/api/datasets").status_code == 401, "la auth no corta"
          assert C.get(f"{B}/api/datasets", headers=H).status_code == 200
          data = open("examples/gestiones_con_texto.csv", "rb").read()
          r = C.post(f"{B}/api/datasets/upload-stream",
                     params={"filename": "g.csv", "name": "ci"},
                     content=data, headers=H).json()
          job = C.post(f"{B}/api/automl/train", headers=H, json={
              "dataset_id": r["dataset"]["id"], "target": "Pago30d",
              "budget_seconds": 20, "max_models": 3, "shap": True,
              "permutation_importance": True, "exclude": ["IdGestion"]}).json()
          for _ in range(120):
              st = C.get(f"{B}/api/jobs/{job['id']}", headers=H).json()
              if st["status"] in ("terminado", "error"): break
              time.sleep(2)
          assert st["status"] == "terminado", st.get("error")
          auc = st["result"]["report"]["champion"]["holdout"]["auc"]
          print(f"ENTRENAMIENTO EN EL .EXE: AUC holdout = {auc:.4f}")
          # el ejemplo tiene señal realista, no fuga: un AUC perfecto sería
          # la señal de que algo se rompió, no de que anda bien
          assert 0.78 < auc < 0.99, f"AUC fuera de lo esperable: {auc}"
          # SHAP se ejercita a propósito: importa numba al arrancar, y cuando
          # numba faltaba el binario moría antes de escuchar. Si la prueba no
          # lo usara, el que se encontraría con el error sería el cliente.
          variables = st["result"]["report"]["features"]["ranking"]
          assert any(v.get("shap_mean_abs") for v in variables), "SHAP no calculó nada"
          print(f"SHAP en el .exe: {len(variables)} variables explicadas")
          PY
          kill $BACK || true

      # ── instaladores ────────────────────────────────────────────────────────
      # Dos cosas que costaron un build cada una:
      #   · van en bash y no en PowerShell, porque PowerShell parte
      #     `-c.win.artifactName="..."` en dos argumentos y electron-builder
      #     toma el segundo pedazo como nombre de archivo de configuración;
      #   · el nombre se pisa en `win.artifactName`, no en el `artifactName` de
      #     primer nivel: la clave específica de la plataforma gana, y el
      #     genérico se ignora sin decir nada.
      # Igual el .exe se mueve por comodín: el nombre real lo arma una plantilla
      # con macros, y si alguno cambiara de valor el paso siguiente no tiene por
      # qué morir buscando un nombre exacto.
      - name: Instalador OWNER (con licencia embebida)
        working-directory: desktop
        shell: bash
        run: |
          npm install
          npx electron-builder --win -p never -c electron-builder.yml \
            -c.extraMetadata.channel=owner \
            -c.win.artifactName="MV-AutoML-Studio-Owner-Setup.exe"
          # Se aparta antes de compilar el demo: los dos empaquetados escriben
          # en dist/ y el segundo puede llevarse puesto lo del primero.
          mkdir -p ../entrega
          mv dist/*Setup.exe ../entrega/MV-AutoML-Studio-Owner-Setup.exe

      - name: Instalador CLIENTE (sin licencia; misma clave pública)
        working-directory: desktop
        shell: bash
        run: |
          rm -f owner/license.key         # el del cliente NO lleva la licencia
          echo 'Compilacion de cliente: sin licencia embebida.' > owner/LEEME.txt
          npx electron-builder --win -p never -c electron-builder.yml \
            -c.extraMetadata.channel=cliente \
            -c.win.artifactName="MV-AutoML-Studio-Setup.exe"
          mv dist/*Setup.exe ../entrega/MV-AutoML-Studio-Setup.exe

      # Cierre de lo que dejaron las compilaciones viejas.
      #
      # `softprops/action-gh-release` con `draft: true` **no** convierte de
      # vuelta a borrador un release que ya estaba publicado: lo actualiza y lo
      # deja público. Como `desktop-latest` venía publicado de antes, el primer
      # intento de cerrar la descarga no cerró nada — subió el instalador nuevo
      # al mismo release abierto, con un texto que decía «esto es un borrador».
      # Peor que no haber hecho nada, porque parecía hecho.
      - name: Cerrar el release público que quedó de antes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
                 --jq '.[] | select(.tag_name=="desktop-latest" and .draft==false) | .id' || true)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=true
            echo "::warning::desktop-latest estaba público con el instalador adentro; se pasó a borrador."
          else
            echo "no hay ningún release público en desktop-latest"
          fi

      # El instalador NO se publica abierto. Un archivo público es el artefacto
      # de ingeniería regalado a cualquiera que pase, competencia incluida, y
      # sin dejar rastro de quién se lo llevó. El release queda en borrador —sus
      # archivos no son alcanzables sin credenciales— y la única puerta es
      # `/api/descargar`, que verifica la licencia del cliente antes de darle un
      # enlace temporal. Quien quiere conocerlo sin comprar pide una demo en
      # vivo desde el sitio.
      #
      # La etiqueta cambia en cada compilación, igual que la del owner. Reusar
      # una etiqueta fija fue lo que abrió el agujero de arriba: un release que
      # ya existe publicado no vuelve solo a borrador. Con una etiqueta nueva,
      # cada release nace borrador y no hay nada que revertir. `/api/descargar`
      # recorre los releases y toma el más nuevo que tenga el instalador, así
      # que el nombre de la etiqueta le da igual.
      - name: Publicar el instalador del CLIENTE (borrador; lo entrega /api/descargar)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('cliente-{0}', github.run_number) }}
          name: MV AutoML Studio — instalador Windows (${{ github.run_number }})
          draft: true
          files: entrega/MV-AutoML-Studio-Setup.exe
          body: |
            Instalador de Windows (64 bits). Arranca en período de prueba y se
            activa a Profesional con una licencia. Permite elegir el directorio
            de instalación y crea los accesos directos en el Escritorio y el
            Menú de inicio.

            Este release es un borrador a propósito: el archivo se entrega por
            `/api/descargar`, que primero verifica la licencia del comprador.

      - name: Publicar OWNER (release borrador, sólo colaboradores)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: owner-${{ github.run_number }}
          name: "Owner build ${{ github.run_number }} (privado)"
          draft: true
          files: entrega/MV-AutoML-Studio-Owner-Setup.exe
          body: |
            Compilación con licencia OWNER embebida: todas las funciones
            habilitadas, incluida la emisión de licencias. Este release es
            un borrador: no es visible públicamente.

      - name: Publicar OWNER (privado, sólo colaboradores del repositorio)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: owner-${{ github.run_number }}
          name: "Owner build ${{ github.run_number }} (privado)"
          draft: false
          files: |
            entrega/MV-AutoML-Studio-Owner-Setup.exe
            entrega/MV-AutoML-Studio-Owner-Portable.zip
            entrega/Activar-OWNER.bat
            instalador-owner/Instalar-en-otro-disco.bat
            instalador-owner/Diagnostico-instalador.bat
          body_path: entrega/CUERPO.md

      # Sólo el activador, que pesa unos 3 KB.
      #
      # Acá iba también el instalador, y fue un error caro: 375 MB por
      # compilación llenaron la cuota de artefactos de la cuenta, y el paso
      # empezó a fallar —`Artifact storage quota has been hit`— dando por
      # perdido un build que ya había compilado y subido todo. El instalador
      # vive en el release, que no consume esa cuota.
      #
      # `continue-on-error` porque esto es una comodidad: que un build entero
      # figure en rojo por no poder guardar una copia de más es peor que no
      # tener la copia.
      - name: Dejar el activador a mano en Actions
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: activador-owner-${{ github.run_number }}
          retention-days: 7
          if-no-files-found: error
          path: entrega/Activar-OWNER.bat

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Windows también, aunque el servidor corra en Linux: el producto que se
  # vende es un instalador de Windows, y la suite es el portón que lo deja
  # empaquetar. Una prueba que sólo falla ahí dejó el build roto seis días sin
  # que nadie lo viera —vaciar el entorno para correr Node mata a Node en
  # Windows, que sin `SystemRoot` no puede inicializar su generador de
  # aleatorios—, y con la matriz en Linux la CI del PR seguía en verde.
  backend:
    name: Backend · Python ${{ matrix.python }} · ${{ matrix.so }}
    runs-on: ${{ matrix.so }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { so: ubuntu-latest, python: "3.11" }
          - { so: ubuntu-latest, python: "3.12" }
          - { so: windows-latest, python: "3.11" }

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Verificar que la aplicación importa
        run: python -c "import sys; sys.path.insert(0,'backend'); import app.main; print(app.main.VERSION)"

      - name: Ejecutar las pruebas
        env:
          # el entorno de CI no debe tener claves: la suite valida el camino sin IA
          MV_CHUNK_ROWS: "1500"
        run: pytest backend/tests -v --durations=10

      # Se ejecuta de verdad, y acá y no en el build de escritorio: ese corre
      # después del merge, así que un script roto se descubriría cuando ya
      # está en main. Acá cuesta dos segundos y corta antes.
      #
      # Vale la pena ejecutarlo porque crea accesos directos por COM
      # (WScript.Shell) desde un comando de PowerShell embebido en un .bat,
      # con una ruta que tiene espacios: «MV AutoML Studio». Ahí es donde se
      # rompen las comillas, y se rompen en silencio — el .bat termina con
      # éxito y el icono no aparece.
      - name: El portable se crea su acceso directo
        if: runner.os == 'Windows'
        shell: cmd
        env:
          MV_SIN_PAUSA: "1"
        run: |
          mkdir "%RUNNER_TEMP%\accesos"
          copy "instalador-owner\Crear-accesos-directos.bat" "%RUNNER_TEMP%\accesos\" >nul
          echo. > "%RUNNER_TEMP%\accesos\MV AutoML Studio.exe"
          call "%RUNNER_TEMP%\accesos\Crear-accesos-directos.bat"
          if errorlevel 1 exit /b 1
          powershell -NoProfile -Command "$fallo = $false; foreach ($c in @('Desktop','Programs')) { $l = Join-Path ([Environment]::GetFolderPath($c)) 'MV AutoML Studio.lnk'; if (Test-Path $l) { $t = (New-Object -ComObject WScript.Shell).CreateShortcut($l).TargetPath; Write-Host ('  ' + $c + ' -> ' + $t); if (-not $t.EndsWith('MV AutoML Studio.exe')) { Write-Host '::error::el acceso apunta a otra cosa'; $fallo = $true } } else { Write-Host ('::error::no se creo el acceso en ' + $c); $fallo = $true } }; if ($fallo) { exit 1 }; Write-Host 'los dos accesos directos se crearon y apuntan al ejecutable'"

  frontend:
    name: Frontend · sintaxis e idiomas
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verificar la sintaxis de todos los módulos
        run: |
          find frontend/assets/js -name "*.js" -print0 | xargs -0 -n1 node --check
          echo "Todos los módulos compilan"

      - name: Verificar los diccionarios de idioma
        run: |
          for f in frontend/assets/i18n/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8')); console.log('$f OK')"
          done

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: Ruff
        run: ruff check backend

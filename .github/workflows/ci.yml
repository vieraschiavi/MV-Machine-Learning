name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Windows también, aunque el servidor corra en Linux: el producto que se
  # vende es un instalador de Windows, y la suite es el portón que lo deja
  # empaquetar. Una prueba que sólo falla ahí dejó el build roto seis días sin
  # que nadie lo viera —vaciar el entorno para correr Node mata a Node en
  # Windows, que sin `SystemRoot` no puede inicializar su generador de
  # aleatorios—, y con la matriz en Linux la CI del PR seguía en verde.
  backend:
    name: Backend · Python ${{ matrix.python }} · ${{ matrix.so }}
    runs-on: ${{ matrix.so }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { so: ubuntu-latest, python: "3.11" }
          - { so: ubuntu-latest, python: "3.12" }
          - { so: windows-latest, python: "3.11" }

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Verificar que la aplicación importa
        run: python -c "import sys; sys.path.insert(0,'backend'); import app.main; print(app.main.VERSION)"

      - name: Ejecutar las pruebas
        env:
          # el entorno de CI no debe tener claves: la suite valida el camino sin IA
          MV_CHUNK_ROWS: "1500"
        run: pytest backend/tests -v --durations=10

  frontend:
    name: Frontend · sintaxis e idiomas
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verificar la sintaxis de todos los módulos
        run: |
          find frontend/assets/js -name "*.js" -print0 | xargs -0 -n1 node --check
          echo "Todos los módulos compilan"

      - name: Verificar los diccionarios de idioma
        run: |
          for f in frontend/assets/i18n/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8')); console.log('$f OK')"
          done

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: Ruff
        run: ruff check backend

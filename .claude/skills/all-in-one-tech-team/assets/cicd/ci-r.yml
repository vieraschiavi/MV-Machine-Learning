# CI R / Shiny — lint + tests testthat. Copiar a .github/workflows/ci.yml
# Supuestos: tests en tests/testthat/. Si el proyecto usa renv, reemplazar el paso de
# dependencias por r-lib/actions/setup-renv@v2. Ajustar la lista de paquetes.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::testthat
            any::lintr
            any::shiny
      - name: Lint
        run: |
          res <- lintr::lint_dir(".")
          print(res)
          if (length(res) > 0) quit(status = 1)
        shell: Rscript {0}
      - name: Tests
        run: testthat::test_dir("tests/testthat", stop_on_failure = TRUE)
        shell: Rscript {0}
